services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-estudos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estudos}
      POSTGRES_DB: ${POSTGRES_DB:-estudos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposto para você poder rodar `npm run dev` contra este mesmo banco.
      - "${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-estudos} -d ${POSTGRES_DB:-estudos}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-estudos}:${POSTGRES_PASSWORD:-estudos}@db:5432/${POSTGRES_DB:-estudos}
      HOST: 0.0.0.0
      PORT: 5183
      # As datas são gravadas no horário local do container — sem isto,
      # estudar depois das 21h cairia no dia seguinte.
      TZ: ${TZ:-America/Sao_Paulo}
      # Exige login. É também o padrão quando há DATABASE_URL, mas fica
      # explícito aqui para ser fácil de achar e de desligar com 0.
      ESTUDOS_LOGIN: ${ESTUDOS_LOGIN:-1}
      # Só ligue com HTTPS na frente: em HTTP puro o navegador descarta um
      # cookie Secure e o login entra em laço.
      COOKIE_SEGURO: ${COOKIE_SEGURO:-0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5182}:5183"
    volumes:
      # Para soltar PDFs e editar o seed sem reconstruir a imagem.
      - ./uploads:/app/uploads
      - ./seed-questoes.js:/app/seed-questoes.js:ro

volumes:
  pgdata:
